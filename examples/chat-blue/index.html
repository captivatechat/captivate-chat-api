<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue chat example</title>
  <link rel="stylesheet" href="/shared/chat.css">
</head>
<body>
  <header>
    <h1>captivate-chat-api: a Vienna Blue bot</h1>
    <span class="status" id="status">Starting…</span>
  </header>
  <div class="app">
    <aside>
      <label>User ID (whose conversations these are)
        <input id="userId" autocomplete="off">
      </label>
      <button id="newBtn" class="primary" disabled>New conversation</button>
      <h2>Conversations</h2>
      <button id="refreshBtn" disabled>Refresh the list</button>
      <ul class="convs" id="convs"></ul>
    </aside>
    <main>
      <div class="toolbar">
        <span id="convTitle">No conversation open.</span>
        <span class="spacer"></span>
        <button id="stopBtn" disabled>Stop</button>
        <button id="reconnectBtn" disabled title="Asks a question, cuts the connection at the first words, and shows the answer read back">Test reconnect</button>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <form class="composer" id="composer">
        <input id="text" placeholder="Ask the bot something" autocomplete="off" disabled>
        <button id="sendBtn" class="primary" disabled>Send</button>
      </form>
    </main>
    <div class="log" id="log" aria-label="What the library did"></div>
  </div>
  <script src="/config.js"></script>
  <script src="/lib/captivate-chat-api.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
