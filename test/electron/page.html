<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blue mode harness</title>
</head>
<body>
  <!-- The library keeps console's methods as they are when it loads, so its warnings are kept from here. -->
  <script>
    window.__warnings = [];
    const warn = console.warn;
    console.warn = (...args) => {
      window.__warnings.push(args.map(String).join(' '));
      warn.apply(console, args);
    };
  </script>
  <!-- The same relative path from test/electron/ on disk, on 127.0.0.1 and on app://myapp. -->
  <script src="../../dist/captivate-chat-api.js"></script>
  <script src="page.js"></script>
</body>
</html>
